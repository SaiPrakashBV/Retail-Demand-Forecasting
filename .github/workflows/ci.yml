name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend, ML and pipeline tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://retail:retail@localhost:5432/retail
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check backend ml airflow mock_odata database tests
      - name: Database migrations apply cleanly
        run: |
          python database/migrate.py
          python database/migrate.py --check
      - name: Re-applying migrations is a no-op
        run: python database/migrate.py | grep "schema up to date"
      - name: Unit tests (ETL data quality, models, reorder rules, API)
        run: pytest tests -q -m "not integration"
      - name: Integration test (migrate -> ETL -> training job -> API)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://retail:retail@localhost:5432/retail
        run: pytest tests/integration -q

  airflow:
    name: Airflow DAG validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: DAGs import without errors in the Airflow image
        run: |
          docker run --rm -v "$PWD/airflow:/opt/airflow/project" -e PYTHONPATH=/opt/airflow/project \
            apache/airflow:3.3.2-python3.12 python -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder='/opt/airflow/project/dags')
          assert not bag.import_errors, bag.import_errors
          assert {'retail_etl', 'forecast_training'} <= set(bag.dag_ids), bag.dag_ids
          etl = bag.dags['retail_etl']
          order = ['start', 'extract', 'clean', 'validate', 'transform', 'load', 'update_status', 'trigger_forecast_training']
          assert [t for t in order if t in etl.task_ids] == order
          print('DAGs OK:', sorted(bag.dag_ids))
          "

  frontend:
    name: Frontend lint, type check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [python, airflow, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        run: docker compose config -q
      - name: Build all images
        run: docker compose build
