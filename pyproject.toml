[project]
name = "retail-sales-forecasting"
version = "0.2.0"
description = "Retail sales analytics, demand and price forecasting, and inventory planning"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:You should not use the 'timeout' argument:Warning",
]
markers = ["integration: needs a PostgreSQL database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependencies are declared as argument defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "tasks", "mock_odata"]
