[project]
name = "retail-forecast"
version = "0.1.0"
description = "Retail sales analytics and 30-day per-product demand forecasting with XGBoost and MLflow"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
