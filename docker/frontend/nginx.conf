server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the api container at request time through Docker's DNS, so nginx starts (and the
    # app loads) even when the API is not up yet, e.g. after Docker restarts containers in any order.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API calls go to the FastAPI service; long timeouts for report downloads.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
